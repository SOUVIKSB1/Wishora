<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141120"/>
      <stop offset="50%" stop-color="#07060A"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#F5C042"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#996515" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldStroke)" stroke-width="8"/>
  
  <!-- Ambient Center Glow Orb -->
  <circle cx="256" cy="256" r="140" fill="#D4AF37" opacity="0.15" filter="url(#goldGlow)"/>

  <!-- Top Crown Sparkle -->
  <path d="M 256 90 L 263 115 L 288 122 L 263 129 L 256 154 L 249 129 L 224 122 L 249 115 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="122" r="3" fill="#FFFFFF"/>
  
  <!-- Stylized Luxury 'W' Letterform -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M 120 180 
             C 120 170, 132 165, 142 170 
             L 186 330 
             L 230 195 
             C 233 186, 245 186, 248 195 
             L 282 300 
             L 326 170 
             C 334 165, 348 170, 348 180 
             L 310 345 
             C 306 360, 290 368, 276 360 
             L 242 260 
             L 204 360 
             C 192 368, 174 360, 170 345 
             Z"/>
  </g>
  
  <!-- Letter Highlights -->
  <path d="M 140 178 L 186 330 L 196 326 L 152 174 Z" fill="#FFE599" opacity="0.4"/>
  <path d="M 250 200 L 282 300 L 288 296 L 256 196 Z" fill="#FFE599" opacity="0.4"/>
</svg>
